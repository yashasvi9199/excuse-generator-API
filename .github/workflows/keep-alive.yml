name: Keep API Alive

on:
  schedule:
  # Runs every 15 days at 00:00 UTC
  -cron: '0 0 */5 * *'
  workflow_dispatch: {} #Manual trigger from git_Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping API Health EndPoint
        run: |
          echo "Pinging API health endpoint..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://https://excuse-generator-api.vercel.app/api/health)
          echo "Response code: $response"

          if [$response -eq 200]; then
            echo "✅ API is alive and healthy"
          else
            echo "❌ API health check failed with code $response"
            exit 1
          fi
        - name: Test Excuse Generation
          run: |
            echo "Testing excuse generation..."
            curl -X POST https://https://excuse-generator-api.vercel.app/api/excuse \
            -H "Content-Type: application/json" \
            -d '{"situation":"Testing API","category":"general","mood":"casual"}' \
            -f -s || (echo "❌ Excuse generation failed" && exit 1)
          echo "✅ Excuse generation working"